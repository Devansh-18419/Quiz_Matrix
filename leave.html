{% extends "layout.html" %}

{% block title %}Delete Account{% endblock %}

{% block body %}
<div class="container py-4 text-center" style="max-width: 480px;">
    <div class="card p-4 shadow-sm border-danger">
        <h3 class="text-danger mb-3">Delete Account</h3>
        <p class="text-muted small">
            This action is <strong>irreversible</strong>. Your account, all quizzes you have created, questions, options, and recorded scores will be permanently erased.
        </p>

        <form action="/leave" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Type <span class="text-danger">DELETE</span> to confirm:</label>
                <input type="text" name="confirmation" class="form-control" placeholder="DELETE" required autocomplete="off">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">Your Current Password:</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 mb-2">Permanently Erase My Account</button>
            <a href="/me" class="btn btn-outline-secondary w-100">Cancel & Go Back</a>
        </form>
    </div>
</div>
{% endblock %}
