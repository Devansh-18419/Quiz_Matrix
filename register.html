{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block body %}
    <form action="/register" method="post">
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" autofocus autocomplete="off" type="text" name="username" placeholder="Username">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" autofocus autocomplete="off" type="password" name="password" placeholder="Password">
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-matrix" type="submit">Register</button>
        </div>

        <div class="text-center mt-3">
            <p class="text-muted">
                Have an account?
                <a href="/login" class="register-link">
                    Log in
                </a>
            </p>
        </div>
    </form>
{% endblock %}
