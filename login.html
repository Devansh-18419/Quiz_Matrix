{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block body %}
    <form action="/login" method="post">
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto" type="text" name="username" placeholder="Username">
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto" type="password" name="password" placeholder="Password">
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-matrix">Log In</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <p class="text-muted">
            Don't have an account?
            <a href="/register" class="register-link">
                Create Account
            </a>
        </p>
    </div>
{% endblock %}
